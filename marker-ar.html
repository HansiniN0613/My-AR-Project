<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Heritage AR - Marker AR</title>

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

  <!-- =========================================================
       AR SCENE
       ========================================================= -->

  <a-scene
    mindar-image="
      imageTargetSrc: assets/marker.mind;
      autoStart: true;
      uiScanning: true;
      uiLoading: true;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >

    <!-- =======================================================
         3D MODELS
         ======================================================= -->

    <a-assets>

      <!-- Buddha -->
      <a-asset-item
        id="buddha-model"
        src="models/head_of_buddha_statue.glb">
      </a-asset-item>

      <!-- Casket -->
      <a-asset-item
        id="casket-model"
        src="models/coral_relic_casket.glb">
      </a-asset-item>

    </a-assets>


    <!-- =======================================================
         LIGHTING
         ======================================================= -->

    <a-light
      type="ambient"
      intensity="1.5">
    </a-light>

    <a-light
      type="directional"
      intensity="2"
      position="2 4 3">
    </a-light>


    <!-- =======================================================
         CAMERA
         ======================================================= -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- =======================================================
         MARKER TARGET
         ======================================================= -->

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >

      <!--
        This is the single artifact entity.

        JavaScript will change its model,
        rotation, scale and visibility.
      -->

      <a-entity
        id="artifact"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.5 0.5 0.5"
        gltf-model="#buddha-model"
        animation="
          property: rotation;
          to: 0 360 0;
          loop: true;
          dur: 10000;
          easing: linear;
          startEvents: start-rotation;
          pauseEvents: stop-rotation;
        "
      >
      </a-entity>

    </a-entity>

  </a-scene>


  <!-- =========================================================
       TOP BAR
       ========================================================= -->

  <div class="ar-top-bar">

    <button
      id="back-button"
      class="ar-icon-button"
      aria-label="Go back">
      ←
    </button>

    <div class="ar-title">
      Heritage AR
    </div>

    <button
      id="info-button"
      class="ar-icon-button"
      aria-label="Information">
      ℹ
    </button>

  </div>


  <!-- =========================================================
       STATUS
       ========================================================= -->

  <div
    id="status"
    class="ar-status">
    Scan the heritage marker
  </div>


  <!-- =========================================================
       CONTROL PANEL
       ========================================================= -->

  <div
    id="control-panel"
    class="ar-control-panel">

    <!-- Artifact selection -->

    <div class="control-section">

      <div class="control-title">
        Select Artifact
      </div>

      <div class="artifact-buttons">

        <button
          id="buddha-button"
          class="artifact-button active">

          🗿 Buddha

        </button>

        <button
          id="casket-button"
          class="artifact-button">

          🏺 Casket

        </button>

      </div>

    </div>


    <!-- Transformation controls -->

    <div class="control-section">

      <div class="control-title">
        Transform
      </div>

      <div class="transform-buttons">

        <button
          id="rotate-left"
          class="control-button">

          ↶

        </button>

        <button
          id="rotate-right"
          class="control-button">

          ↷

        </button>

        <button
          id="scale-down"
          class="control-button">

          −

        </button>

        <button
          id="scale-up"
          class="control-button">

          +

        </button>

      </div>

    </div>


    <!-- Action buttons -->

    <div class="control-section">

      <div class="control-title">
        Actions
      </div>

      <div class="action-buttons">

        <button
          id="reset-object"
          class="action-button">

          ↺ Reset

        </button>

        <button
          id="remove-object"
          class="action-button danger">

          🗑 Remove

        </button>

        <button
          id="show-object"
          class="action-button success"
          style="display: none;">

          ＋ Add Artifact

        </button>

      </div>

    </div>

  </div>


  <!-- =========================================================
       INFORMATION PANEL
       ========================================================= -->

  <div
    id="info-panel"
    class="info-panel">

    <div class="info-content">

      <button
        id="close-info"
        class="close-info">

        ×

      </button>

      <h2 id="info-title">
        Heritage Artifact
      </h2>

      <p id="info-description">
        Select an artifact to learn more about it.
      </p>

    </div>

  </div>


  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->

  <script src="js/marker-ar.js"></script>

</body>
</html>

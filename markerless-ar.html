<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Markerless AR | Heritage AR Guide</title>
    <style>
        :root { --ink: #fff8ec; --panel: rgba(35, 25, 17, 0.84); --accent: #d99a4e; }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #17120e; font-family: Georgia, serif; }
        canvas { display: block; }
        #hud { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
        #info, #controls { pointer-events: auto; color: var(--ink); background: var(--panel); border: 1px solid rgba(255, 248, 236, 0.22); box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25); backdrop-filter: blur(8px); }
        #info { position: absolute; top: max(16px, env(safe-area-inset-top)); left: 16px; right: 16px; padding: 14px 16px; border-radius: 8px; }
        #status { margin: 0; font-size: 16px; line-height: 1.35; }
        #controls { position: absolute; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); display: grid; gap: 10px; padding: 12px; border-radius: 8px; }
        .control-row { display: flex; gap: 8px; }
        button, a { min-height: 44px; border: 1px solid rgba(255, 248, 236, 0.26); border-radius: 6px; padding: 10px 12px; color: var(--ink); background: rgba(255, 248, 236, 0.12); font: 600 14px Georgia, serif; text-decoration: none; cursor: pointer; }
        button { flex: 1; }
        button.active, #start-ar { color: #21160d; background: var(--accent); border-color: var(--accent); }
        button:disabled { opacity: 0.45; cursor: default; }
        #start-ar, #back-link { width: 100%; display: block; text-align: center; }
        @media (min-width: 700px) { #info, #controls { left: 24px; right: auto; width: 360px; } }
    </style>

</head>

<body>

<div id="hud">
    <section id="info" aria-live="polite">
        <p id="status">Tap Start AR, then move your phone slowly to find a flat surface.</p>
    </section>
    <section id="controls" aria-label="AR controls">
        <div class="control-row">
            <button id="buddha-button" type="button" class="active">Buddha</button>
            <button id="casket-button" type="button">Casket</button>
        </div>
        <div class="control-row">
            <button id="rotate-left" type="button">Rotate left</button>
            <button id="rotate-right" type="button">Rotate right</button>
        </div>
        <div class="control-row">
            <button id="scale-down" type="button">Scale -</button>
            <button id="scale-up" type="button">Scale +</button>
            <button id="remove-object" type="button">Remove</button>
        </div>
        <button id="start-ar" type="button">Start AR</button>
        <a id="back-link" href="index.html">Back to home</a>
    </section>
</div>

<script type="module" src="js/markerless-ar.js"></script>

</body>

</html>

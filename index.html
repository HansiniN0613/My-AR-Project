<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0">

    <title>Heritage AR Guide</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <div class="landing">

        <h1>🏺 Heritage AR Guide</h1>

        <p class="subtitle">
            Explore cultural heritage through
            Augmented Reality
        </p>

        <div class="menu">

            <button id="markerARButton">
                📷 Marker AR
            </button>

            <button id="markerlessARButton">
                🌐 Markerless AR
            </button>

        </div>

        <div class="info">

            <h2>How to use</h2>

            <p>
                Use Marker AR to scan the provided
                heritage marker.
            </p>

            <p>
                Use Markerless AR to place a
                3D artifact on a real surface.
            </p>

        </div>

    </div>

    <script src="js/main.js"></script>

</body>

</html>
